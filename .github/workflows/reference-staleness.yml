name: reference-auto-refresh

# Runs every Monday at 13:00 PHT (05:00 UTC) — weekly cadence matches the
# 7-day verification horizon.
#
# On schedule / workflow_dispatch:
#   1. detect stale files
#   2. run refresh.sh → Claude re-verifies each stale file → patch in updates/
#   3. apply_patches.py merges all verdicts automatically
#   4. land the result as an AUTO-MERGE PR (not a direct push): push a branch,
#      open a PR, enable auto-merge. The PR merges itself once `verify` is green.
#
# Why a PR and not a direct push: `master` is a protected branch (required
# `verify` check + enforce_admins). A direct push — even from a bot — is
# rejected, and a push made with GITHUB_TOKEN never triggers the check that
# would unblock it (deadlock). The PR is opened with a GitHub App token, not
# GITHUB_TOKEN, specifically because GITHUB_TOKEN-authored PRs do NOT trigger
# further workflow runs — so `verify` would never start and auto-merge would
# hang. Provision the app via repo secrets REFRESH_APP_ID and
# REFRESH_APP_PRIVATE_KEY (Contents: RW + Pull requests: RW, installed on this
# repo). Without them the job skips cleanly instead of failing.
#
# Repo prerequisites (set out of band, once): "Allow auto-merge" must be ON and
# squash merging allowed — the landing step uses `gh pr merge --squash --auto`.
#
# On pull_request (references/** or SKILL.md changed):
#   gate only — block merge if any file is stale or malformed.

on:
  schedule:
    - cron: "0 5 * * 1"   # Monday 13:00 PHT (05:00 UTC)
  workflow_dispatch:
  pull_request:
    paths:
      - "references/**"
      - "SKILL.md"

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run staleness gate
        run: python3 scripts/check_refs.py

  auto-refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Serialize refresh runs so a manual dispatch can't race the Monday schedule.
    concurrency:
      group: auto-refresh
      cancel-in-progress: false
    steps:
      - name: Detect app credentials
        id: appcreds
        env:
          APP_ID: ${{ secrets.REFRESH_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "REFRESH_APP_ID / REFRESH_APP_PRIVATE_KEY not set — cannot open an auto-merge PR against protected master. Skipping refresh." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.appcreds.outputs.configured == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0

      - name: Check for stale files
        id: gate
        run: |
          set +e
          python3 scripts/check_refs.py --json > gate.json
          set -e
          STALE=$(python3 -c "import json; print(len(json.load(open('gate.json'))['stale_files']))")
          echo "stale_count=$STALE" >> "$GITHUB_OUTPUT"
          echo "stale files: $STALE"

      - name: Check Claude credentials
        if: steps.gate.outputs.stale_count != '0'
        id: creds
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set — skipping refresh." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # From here on, every step requires: stale files present, Claude creds set,
      # AND app creds set (needed to land the result).
      - name: Install Claude Code
        if: steps.gate.outputs.stale_count != '0' && steps.creds.outputs.configured == 'true' && steps.appcreds.outputs.configured == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Refresh stale files
        if: steps.gate.outputs.stale_count != '0' && steps.creds.outputs.configured == 'true' && steps.appcreds.outputs.configured == 'true'
        run: ./scripts/refresh.sh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Apply patches
        if: steps.gate.outputs.stale_count != '0' && steps.creds.outputs.configured == 'true' && steps.appcreds.outputs.configured == 'true'
        run: python3 scripts/apply_patches.py

      - name: Open auto-merge PR
        if: steps.gate.outputs.stale_count != '0' && steps.creds.outputs.configured == 'true' && steps.appcreds.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name  "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          # Stage first, then check the INDEX — refresh.sh writes brand-new
          # untracked files under updates/<date>/ that a tracked-only
          # `git diff` would miss, silently dropping the patches.
          git add references/ updates/
          if git diff --cached --quiet; then
            echo "nothing changed after refresh — no PR needed"
            exit 0
          fi
          TODAY=$(date -u +%F)
          # Per-run branch name so a manual dispatch can't collide with the
          # same-day scheduled run on push / pr-create.
          BRANCH="auto-refresh/${TODAY}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m "chore: auto-refresh reference files ${TODAY}"
          git push -u origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "chore: auto-refresh reference files ${TODAY}" \
            --body "Automated weekly reference re-verification. Review patches under \`updates/${TODAY}/\`. Auto-merges once the \`verify\` check passes."
          gh pr merge "$BRANCH" --squash --auto --delete-branch
